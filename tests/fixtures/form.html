<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>New AP bill - Ledger</title></head>
<body>
<header>
  <nav>
    <a href="/form.html">Bills</a>
    <a href="/popup.html" target="_blank">Popup link</a>
    <a href="/form.html#top">Skip</a>
    <a href="/payments.html">Payments</a>
    <a href="/delete/3">Delete item</a>
  </nav>
</header>
<main>
  <h1>New AP bill</h1>
  <div id="flash" role="alert" style="display:none"></div>
  <form id="f" action="#" novalidate>
    <label for="inv">Invoice number</label>
    <input id="inv" name="invoice_number" type="text" value="CX-2025-0412">

    <label for="vendor">Vendor</label>
    <select id="vendor" name="vendor">
      <option value="">-- Select vendor --</option>
      <option value="CX">Company X Ltd</option>
      <option value="CXH">Company X Holdings</option>
      <option value="GLB" selected>Globex Corporation</option>
      <option value="INI">Initech</option>
      <option value="UMB">Umbrella plc</option>
      <option value="WNT">Wonka Industries</option>
      <option value="HOO">Hooli</option>
      <option value="SOY">Soylent</option>
      <option value="STK">Stark Industries</option>
      <option value="OLD" disabled>Old Vendor (disabled)</option>
    </select>

    <label for="due">Due date</label>
    <input id="due" name="due_date" type="text" placeholder="YYYY-MM-DD" value="15/11/2026">

    <label><input type="checkbox" name="urgent"> Urgent</label>
    <label for="pw">Portal password</label>
    <input id="pw" name="pw" type="password" value="hunter2">
    <textarea id="notes" name="notes" aria-label="Notes"></textarea>

    <button type="submit">Save bill</button>
    <button type="button" id="next">Next</button>
    <button type="button" id="del">Delete</button>
  </form>

  <form id="search" action="#" novalidate>
    <input type="text" name="q" aria-label="Search bills">
    <button type="submit">Search</button>
  </form>

  <div style="display:none"><button>Hidden button</button><p>Hidden paragraph text</p></div>
  <div style="visibility:hidden"><button>Invisible button</button></div>
  <button aria-hidden="true">Aria hidden button</button>
  <button style="width:0;height:0;padding:0;border:0;overflow:hidden">Zero size button</button>

  <table>
    <tr><th>Invoice</th><th>Amount</th><th>Status</th></tr>
    <tr><td>CX-2025-0412</td><td>1,200.00</td><td>Open</td></tr>
    <tr><td>CX-2025-0377</td><td>840.50</td><td><a href="/bills/377">View</a></td></tr>
  </table>

  <p>Files:
    <a href="/files/report.txt" download>Download report</a>
    <a href="/files/inline.pdf">Open PDF</a>
  </p>
  <button type="button" onclick="alert('Hello dialog')">Show dialog</button>
</main>
<script>
  const f = document.getElementById('f'), flash = document.getElementById('flash');
  const due = document.getElementById('due');
  f.addEventListener('submit', (e) => {
    e.preventDefault();
    flash.style.display = 'block';
    if (!/^\d{4}-\d{2}-\d{2}$/.test(due.value)) {
      flash.textContent = 'Due date must be in YYYY-MM-DD format';
      due.setAttribute('aria-invalid', 'true');
    } else {
      due.removeAttribute('aria-invalid');
      flash.textContent = 'Bill saved: ' + document.getElementById('vendor').selectedOptions[0].text + ' / ' + due.value;
    }
  });
  document.getElementById('search').addEventListener('submit', (e) => e.preventDefault());
</script>
</body>
</html>
