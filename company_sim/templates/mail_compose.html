{% extends "base.html" %}
{% block title %}Compose - {{ app_title }}{% endblock %}
{% block content %}
<h1>{{ 'Reply' if values.reply_to else 'Compose message' }}</h1>
{% if error %}<div role="alert" class="alert alert-error">{{ error }}</div>{% endif %}
<form method="post" action="/mail/compose" class="card">
  <input type="hidden" name="reply_to" value="{{ values.reply_to }}">
  <label for="to">To</label>
  <input id="to" name="to" type="text" value="{{ values.to }}" required>
  <label for="subject">Subject</label>
  <input id="subject" name="subject" type="text" value="{{ values.subject }}" required>
  <label for="body">Message</label>
  <textarea id="body" name="body">{{ values.body }}</textarea>
  <div class="actions"><button type="submit">Send</button><a class="button secondary" href="/mail/inbox">Cancel</a></div>
</form>
{% endblock %}
