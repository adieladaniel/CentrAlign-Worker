{% extends "base.html" %}
{% block title %}Sign in - {{ app_title }}{% endblock %}
{% block content %}
<div class="card login-card">
  <h1>Sign in</h1>
  {% if expired %}<div role="alert" class="alert alert-warning">Your session has expired, please sign in again</div>{% endif %}
  {% if error %}<div role="alert" class="alert alert-error">{{ error }}</div>{% endif %}
  <form method="post" action="{{ login_url }}">
    <input type="hidden" name="next" value="{{ next_url }}">
    <label for="username">{{ username_label }}</label>
    <input id="username" name="username" type="{{ 'email' if email_input else 'text' }}" autocomplete="username" required>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <div class="actions"><button type="submit">Sign in</button></div>
  </form>
</div>
{% endblock %}
