version: 2
updates:
  # Python dependencies: Dependabot bumps the exact pins in constraints.txt (and requirements*.txt), minor/patch
  # versions in one grouped PR per week, majors as separate PRs.
  # Ignored on purpose:
  # - playwright: a bump must be made together with PLAYWRIGHT_VERSION in the Dockerfile (the image tag), by hand,
  #   following the recipe in the header of constraints.txt; the lint job fails when the two differ.
  # - transitive pins that a direct dependency caps, so a bump on its own can never install: pyee (playwright requires
  #   pyee<14), websockets and tenacity (google-genai requires websockets<17 and tenacity<9.2). They move when the
  #   package that caps them moves.
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: playwright
      - dependency-name: pyee
      - dependency-name: websockets
      - dependency-name: tenacity
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]
