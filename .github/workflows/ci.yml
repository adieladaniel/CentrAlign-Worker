name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    name: Lint (ruff, actionlint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            constraints.txt
      - name: Install dev tools
        run: python -m pip install -r requirements-dev.txt -c constraints.txt
      - name: ruff
        run: ruff check . --output-format=github
      - name: Playwright pin matches the Dockerfile
        run: |
          docker_version=$(sed -n 's/^ARG PLAYWRIGHT_VERSION=//p' Dockerfile)
          pinned=$(sed -n 's/^playwright==\([0-9.]*\).*/\1/p' constraints.txt)
          echo "Dockerfile: $docker_version, constraints.txt: $pinned"
          if [ -z "$docker_version" ] || [ "$docker_version" != "$pinned" ]; then
            echo "::error::PLAYWRIGHT_VERSION in the Dockerfile and the playwright pin in constraints.txt must be the same"
            exit 1
          fi
      - name: actionlint
        run: actionlint -color

  test-fast:
    name: Tests (file mode, no database)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            constraints.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -c constraints.txt
      - name: Playwright version
        id: pw
        run: echo "version=$(python -c 'import importlib.metadata as m; print(m.version("playwright"))')" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Install Chromium and its system libraries
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: python -m playwright install --with-deps chromium
      - name: Install Chromium system libraries (browser came from the cache)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: python -m playwright install-deps chromium
      - name: Run the suite (DATABASE_URL is not set, so the PostgreSQL tests skip)
        run: |
          set -o pipefail
          python -m pytest -q --junitxml=junit-fast.xml 2>&1 | tee pytest-fast.log
      - name: Summary
        if: always()
        run: |
          if [ -f junit-fast.xml ]; then
            python .github/scripts/junit_summary.py junit-fast.xml --title "Fast suite (file mode, DB tests skipped by design)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No JUnit file was written: pytest did not finish." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-fast
          path: |
            junit-fast.xml
            pytest-fast.log
          if-no-files-found: ignore
          retention-days: 14

  test-full:
    name: Tests (full, PostgreSQL 18)
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: ci-test-password
          POSTGRES_DB: oneforall
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # Throwaway server inside this job's service container; the password is a CI-only value, not a secret.
      DATABASE_URL: postgresql+asyncpg://postgres:ci-test-password@localhost:5432/oneforall
      ONEFORALL_TEST_DB: oneforall_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            constraints.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -c constraints.txt
      - name: Playwright version
        id: pw
        run: echo "version=$(python -c 'import importlib.metadata as m; print(m.version("playwright"))')" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Install Chromium and its system libraries
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: python -m playwright install --with-deps chromium
      - name: Install Chromium system libraries (browser came from the cache)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: python -m playwright install-deps chromium
      - name: Run the full suite
        run: |
          set -o pipefail
          python -m pytest -q --junitxml=junit-full.xml 2>&1 | tee pytest-full.log
      - name: Summary and DB coverage check (fails when any PostgreSQL test was skipped)
        if: always()
        run: |
          if [ -f junit-full.xml ]; then
            python .github/scripts/junit_summary.py junit-full.xml --title "Full suite (PostgreSQL 18)" --require-no-db-skips --min-tests 600 >> "$GITHUB_STEP_SUMMARY"
            python .github/scripts/junit_summary.py junit-full.xml --require-no-db-skips --min-tests 600 > /dev/null
          else
            echo "No JUnit file was written: pytest did not finish." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: Migrate a scratch database and check it
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:ci-test-password@localhost:5432/oneforall_test_scratch
        run: |
          python - <<'PY'
          import asyncio, os
          from worker.db.bootstrap import create_database
          print("scratch database created" if asyncio.run(create_database(os.environ["DATABASE_URL"])) else "scratch database already there")
          PY
          python -m worker.db migrate
          python -m worker.db check
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-full
          path: junit-full.xml
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-logs-full
          path: pytest-full.log
          if-no-files-found: ignore
          retention-days: 14

  docker:
    name: Docker image builds and starts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build (not pushed)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: oneforall-agent:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the container (single-user shape)
        run: |
          vault_key=$(docker run --rm oneforall-agent:ci python3 -m worker.vault generate-key)
          docker run -d --name ofa -p 8080:8080 \
            -e VAULT_KEY="$vault_key" \
            -e ACCESS_PASSWORD="ci-smoke-$RANDOM$RANDOM" \
            -e SESSION_SECRET="ci-smoke-$RANDOM$RANDOM$RANDOM" \
            oneforall-agent:ci >/dev/null
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/healthz; then
              echo
              echo "healthy after about $((i * 2))s"
              exit 0
            fi
            sleep 2
          done
          echo "the container did not become healthy within 120s"
          exit 1
      - name: Container logs on failure
        if: failure()
        run: docker logs ofa 2>&1 | tail -100
      - name: Stop container
        if: always()
        run: docker rm -f ofa || true
