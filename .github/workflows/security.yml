name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 5 * * 1" # Mondays 05:23 UTC: new advisories appear without any code change
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  GITLEAKS_VERSION: "8.30.1"
  # sha256 of gitleaks_<version>_linux_x64.tar.gz from the release's checksums file
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

jobs:
  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # scan the whole history, not only the tip
      # The gitleaks CLI is used instead of gitleaks/gitleaks-action: that action needs a paid GITLEAKS_LICENSE key as
      # soon as the repository belongs to a GitHub organization. The CLI is MIT licensed, needs no key or secret, and
      # works the same for a personal or an organization repository. The download is verified against a pinned hash.
      - name: Install gitleaks
        run: |
          curl -fsSL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check -
          mkdir -p "$RUNNER_TEMP/gitleaks"
          tar -xzf gitleaks.tar.gz -C "$RUNNER_TEMP/gitleaks" gitleaks
          rm gitleaks.tar.gz
          echo "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"
      - name: Scan the git history
        run: gitleaks git . --config .gitleaks.toml --redact --no-banner --report-format json --report-path "$RUNNER_TEMP/gitleaks-report.json"
      - name: Upload the (redacted) report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: gitleaks-report
          path: ${{ runner.temp }}/gitleaks-report.json
          if-no-files-found: ignore
          retention-days: 14

  pip-audit:
    name: Dependency vulnerabilities (pip-audit)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            constraints.txt
      - name: Install pip-audit
        run: python -m pip install -r requirements-dev.txt -c constraints.txt
      # pip-audit has no severity filter (the advisories it reads carry none), so this job reports instead of blocking:
      # every finding is shown in the job summary and as a warning annotation, and the job stays green. Treat a
      # finding as a to-do (bump the pin in constraints.txt / the range in requirements.txt), not as a broken build.
      - name: Audit the pinned set (what CI tests) and the unpinned set (what the Docker image resolves today)
        run: |
          {
            echo "### pip-audit"
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          found=0
          audit() {
            local title="$1"; shift
            local out
            if out=$(pip-audit "$@" --format markdown 2>pip-audit.err); then
              printf '**%s:** no known vulnerabilities.\n\n' "$title" >> "$GITHUB_STEP_SUMMARY"
            else
              found=1
              printf '**%s:**\n\n%s\n\n' "$title" "$out" >> "$GITHUB_STEP_SUMMARY"
              tail -5 pip-audit.err >> "$GITHUB_STEP_SUMMARY" || true
              echo "::warning title=pip-audit::$title: known vulnerabilities or an audit error, see the job summary"
            fi
          }
          audit "constraints.txt (pinned versions)" -r constraints.txt --no-deps --disable-pip
          audit "requirements.txt (resolved fresh)" -r requirements.txt
          echo "findings=$found"
