name: Nightly load test

on:
  schedule:
    - cron: "41 2 * * *" # every night, 02:41 UTC
  workflow_dispatch:

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  loadtest:
    name: Small load test (policy LLM, PostgreSQL 18)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: ci-test-password
          POSTGRES_DB: oneforall
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # scripts/loadtest.py takes the server and credentials from DATABASE_URL and creates/drops its own throwaway
      # database (oneforall_load) there, so a plain service container is enough. Throwaway CI-only password.
      DATABASE_URL: postgresql+asyncpg://postgres:ci-test-password@localhost:5432/oneforall
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            constraints.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -c constraints.txt
      - name: Playwright version
        id: pw
        run: echo "version=$(python -c 'import importlib.metadata as m; print(m.version("playwright"))')" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Install Chromium and its system libraries
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: python -m playwright install --with-deps chromium
      - name: Install Chromium system libraries (browser came from the cache)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: python -m playwright install-deps chromium
      # --users must be at least 4 (admin, operator, approver, viewer), so 4 is the smallest profile the script accepts.
      - name: Load test
        run: >-
          python scripts/loadtest.py --profile nightly --orgs 2 --users 4 --runs 6 --workers 1 --concurrency 2
          --think-ms 300 --timeout-s 900 --out loadtest-results/nightly.json
      - name: Summary and verdict (fails below 100% ground truth or on any isolation leak)
        if: always()
        run: |
          set -o pipefail
          if [ -f loadtest-results/nightly.md ]; then
            cat loadtest-results/nightly.md >> "$GITHUB_STEP_SUMMARY"
          fi
          python .github/scripts/loadtest_check.py loadtest-results/nightly.json --profile nightly | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: loadtest-nightly
          path: loadtest-results/
          if-no-files-found: ignore
          retention-days: 30
